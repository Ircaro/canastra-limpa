services:
  - type: web
    name: canastra-limpa
    runtime: node
    plan: free
    region: virginia
    branch: main
    autoDeploy: true
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start -w @canastra/server
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
